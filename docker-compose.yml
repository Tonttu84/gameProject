# Local test stack: the full game (engine + campaign server + frontend) plus
# MongoDB. On any machine with Docker (Windows: Docker Desktop):
#
#   docker compose up --build
#   → open http://localhost:5173 and log in as testuser / test
#
# Campaigns persist in the named volume; `docker compose down -v` wipes them.
services:
  mongo:
    image: mongo:7
    # Don't stream mongo's (very chatty) logs into `compose up` — they drown
    # the game server's boot banner. Still recorded: `docker compose logs mongo`.
    attach: false
    volumes:
      - gamedb:/data/db

  game:
    build: .
    # The game lives at 5173 on EVERY machine: natively that's the Vite dev
    # server, in Docker this one server is UI + API, so it listens on 5173
    # directly (PORT override) and the banner it prints stays truthful.
    # CI runs the image without this override, on the Dockerfile's 3001.
    ports:
      - "5173:5173"
    environment:
      PORT: 5173
      MONGODB_URI: mongodb://mongo:27017
      DB_NAME: gamedb
      # Local-only convenience login (testuser/test). Remove both this and
      # the default SECRET before exposing the stack to anyone but yourself.
      DEV_SEED: "1"
      # Test-only: force a deterministic 3-choice, non-deferred augur reveal so
      # the e2e reliably exercises the multi-choice path (all six ids are choice
      # events, one pair per severity, all neutral/good valence). Never in prod.
      DEV_AUGURY: "merchant_caravan:refugees,sellswords:drillmaster,horses:deserter_lord,refugees:merchant_caravan"
    depends_on:
      - mongo

volumes:
  gamedb:
