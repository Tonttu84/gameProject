name: CI

on:
  push:
  pull_request:

jobs:
  # Fresh actions/checkout is a stand-in for "a different computer just
  # cloned this repo" — the one place that actually proves vendored
  # .claude/skills/ content survives git and isn't silently gitignored.
  claude-skills:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify vendored Claude skills survived the checkout
        run: ./scripts/check_claude_skills.sh

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The engine is headless (no SFML/X11) — g++ and make on ubuntu-latest
      # are all `make test-serial` needs.
      #
      # Uses the serial runner (not the default `make test`, which shards
      # across processes) so CI stays a trustworthy cross-check independent
      # of the parallel sharding script.
      - name: Build and run tests
        run: make test-serial

  # Builds the distributable image (engine + campaign server + frontend) and
  # smokes a real campaign turn through it — this is the only place the
  # Docker stack is exercised, since dev machines run the stack via WSL.
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t gameproject .

      - name: Boot the stack
        run: |
          docker network create smoke
          docker run -d --name mongo --network smoke mongo:7
          docker run -d --name game --network smoke -p 3001:3001 \
            -e MONGODB_URI=mongodb://mongo:27017 -e DEV_SEED=1 gameproject
          for i in $(seq 1 60); do
            curl -fs http://localhost:3001/api/info > /dev/null && exit 0
            sleep 2
          done
          echo "server never came up"
          docker ps -a
          echo "── game logs:";  docker logs game  2>&1 || true
          echo "── mongo logs:"; docker logs mongo 2>&1 | tail -20 || true
          exit 1

      - name: Smoke a campaign turn (login → create → forage → battle → end-day)
        run: |
          set -e
          BASE=http://localhost:3001/api
          TOKEN=$(curl -fs -X POST $BASE/login -H 'Content-Type: application/json' \
            -d '{"username":"testuser","password":"test"}' | jq -r .token)
          test "$TOKEN" != "null"
          AUTH="Authorization: Bearer $TOKEN"
          ID=$(curl -fs -X POST $BASE/campaigns -H "$AUTH" -H 'Content-Type: application/json' -d '{}' | jq -r .id)
          test "$ID" != "null"
          curl -fs -X POST $BASE/campaigns/$ID/forage -H "$AUTH" -H 'Content-Type: application/json' \
            -d '{"assignment":{"Soldier":100}}' | jq -e '.forage.capacityKg > 0' > /dev/null
          # A real battle proves the headless engine path: the ./game battle
          # subprocess simulates and returns a result + recorded replay.
          WINNER=$(curl -fs -X POST $BASE/campaigns/$ID/battles -H "$AUTH" -H 'Content-Type: application/json' \
            -d '{"player_placement":[{"unit_type":"Soldier","q":4,"r":4}]}' | jq -r .winner)
          echo "battle winner: $WINNER"; test -n "$WINNER" && test "$WINNER" != "null"
          curl -fs -X POST $BASE/campaigns/$ID/end-day -H "$AUTH" -H 'Content-Type: application/json' -d '{}' \
            | jq -e '.report.forage.harvested.food >= 0 and .campaign.day == 2' > /dev/null
          # The image serves the built frontend from the same origin.
          curl -fs http://localhost:3001/ | grep -q '<div id="root">'

      - name: Dump server logs on failure
        if: failure()
        run: |
          docker ps -a
          echo "── game logs:";  docker logs game  2>&1 || true
          echo "── mongo logs:"; docker logs mongo 2>&1 | tail -20 || true

  # Browser-driven end-to-end coverage: Playwright drives the SAME image a
  # player would use (SPA + /api served same-origin), through a full campaign
  # turn. Attaches to a running stack — the tests never boot one themselves,
  # so this job boots the image on :3001 and points them at it.
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t gameproject .

      - name: Boot the stack
        run: |
          docker network create e2e
          docker run -d --name mongo --network e2e mongo:7
          docker run -d --name game --network e2e -p 3001:3001 \
            -e MONGODB_URI=mongodb://mongo:27017 -e DEV_SEED=1 \
            -e DEV_AUGURY="merchant_caravan:refugees,sellswords:drillmaster,horses:deserter_lord,refugees:merchant_caravan" \
            gameproject
          for i in $(seq 1 60); do
            curl -fs http://localhost:3001/api/info > /dev/null && exit 0
            sleep 2
          done
          echo "server never came up"
          docker ps -a
          echo "── game logs:";  docker logs game  2>&1 || true
          exit 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright + Chromium
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:3001
        run: npm test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Dump server logs on failure
        if: failure()
        run: |
          docker ps -a
          echo "── game logs:";  docker logs game  2>&1 || true
          echo "── mongo logs:"; docker logs mongo 2>&1 | tail -20 || true
